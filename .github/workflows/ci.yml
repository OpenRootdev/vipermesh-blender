name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Check documentation translations
        run: |
          node --test tests/i18n-validator.test.mjs
          node scripts/validate-i18n.mjs
      - run: npm run check
      - run: npm run schemas:check
      - run: python -m py_compile addon/vipermesh-addon.py
